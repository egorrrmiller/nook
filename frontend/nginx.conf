map $http_x_forwarded_proto $nook_forwarded_proto {
    default $scheme;
    ~*^https(?:,|$) https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests stay same-origin from the browser and go to ASP.NET.
    location /api/ {
        proxy_pass http://api:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nook_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # SignalR needs WebSocket upgrade headers.
    location /hub {
        proxy_pass http://api:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nook_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Hocuspocus listens at / internally; remove the public /collab prefix.
    location = /collab {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /collab/ {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Vite/React history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
