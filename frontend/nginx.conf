map $http_x_forwarded_proto $nook_forwarded_proto {
    default $scheme;
    ~*^https(?:,|$) https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests stay same-origin from the browser and go to ASP.NET.
    location /api/ {
        # Self-hosted Nook does not impose a product-level upload quota. Operators can still set
        # NOOK_MAX_UPLOAD_MB and/or override this in their own reverse proxy.
        client_max_body_size 0;
        # File downloads (especially PDFs) must stream straight to the browser. With the default
        # response buffering nginx writes large upstream responses into proxy_temp before the
        # client receives them, which adds disk I/O and makes the PDF viewer look stalled.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://api:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nook_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # SignalR needs WebSocket upgrade headers.
    location /hub {
        proxy_pass http://api:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nook_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Hocuspocus listens at / internally; remove the public /collab prefix.
    location = /collab {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /collab/ {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # PDF.js and other modern workers are emitted as native ES modules. Alpine's nginx MIME
    # table does not include .mjs, and browsers refuse module workers served as octet-stream.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Vite/React history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
