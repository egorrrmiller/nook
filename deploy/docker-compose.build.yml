# Optional local-build override. Production uses deploy/docker-compose.yml alone.
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml up -d --build

services:
  api:
    image: nook-api:local
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile

  collab:
    image: nook-collab:local
    build:
      context: ../services/collab
      dockerfile: Dockerfile

  web:
    image: nook-web:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
